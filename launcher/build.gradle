plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.neonlauncher.LauncherApp'
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls']
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.46.0.1'
}
